[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beachhead"
version = "0.1.0"
description = "Fork, wait, clone, branch -- the setup before your first pull request."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Tushar Nagar" }]
keywords = ["github", "cli", "open-source", "contributing", "git"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

# Deliberately empty: beachhead only imports the standard library. See
# README.md#why-zero-dependencies.
dependencies = []

[project.scripts]
beachhead = "beachhead.cli:main"

[project.urls]
Homepage = "https://github.com/tusharnagar2002/beachhead"
Issues = "https://github.com/tusharnagar2002/beachhead/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/beachhead"]
